<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: #fff;
      border-radius: 12px;
      padding: 48px 40px;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 8px;
    }
    p.subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 32px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #333;
      margin-bottom: 6px;
    }
    input, textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      color: #1a1a1a;
      margin-bottom: 20px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus {
      border-color: #4f46e5;
    }
    textarea {
      height: 140px;
      resize: vertical;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #4338ca; }
    #msg {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      color: #4f46e5;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>お問い合わせ</h1>
    <p class="subtitle">ご質問・ご相談はこちらからお気軽にどうぞ。</p>
    <form id="contactForm">
      <label for="name">お名前</label>
      <input type="text" id="name" name="name" placeholder="山田 太郎" required>

      <label for="email">メールアドレス</label>
      <input type="email" id="email" name="email" placeholder="example@email.com" required>

      <label for="message">お問い合わせ内容</label>
      <textarea id="message" name="message" placeholder="ご質問・ご相談内容をご記入ください" required></textarea>

      <button type="submit">送信する</button>
      <p id="msg"></p>
    </form>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxa_RKnaZm69gf1-axZawZBax30nVreyAds5QOnpu4NsLm2Bb7FL6c-D9qADMONFg1ljA/exec';

    document.getElementById('contactForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = this.querySelector('button');
      const msg = document.getElementById('msg');
      btn.disabled = true;
      btn.textContent = '送信中...';
      msg.textContent = '';

      const data = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        message: document.getElementById('message').value
      };

      try {
        const formData = new FormData();
        formData.append('name', data.name);
        formData.append('email', data.email);
        formData.append('message', data.message);

        await fetch(GAS_URL, {
          method: 'POST',
          mode: 'no-cors',
          body: formData
        });
        msg.textContent = '送信が完了しました。ありがとうございました！';
        this.reset();
      } catch (err) {
        msg.textContent = 'エラーが発生しました。時間をおいて再度お試しください。';
      } finally {
        btn.disabled = false;
        btn.textContent = '送信する';
      }
    });
  </script>
</body>
</html>
